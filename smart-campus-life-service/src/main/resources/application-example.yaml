server:
  port: 8082

spring:
  application:
    name: smart-campus-life
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_campus_life?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379
      database: 6
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME:hmdp}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:hmdp}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2
          max-interval: 10000ms
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:openai}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:openai}
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      # DeepSeek 使用 OpenAI 兼容协议，因此仍复用 Spring AI OpenAI Starter。
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
          temperature: 0.2
      # Embedding 与 DeepSeek Chat 分开配置，默认使用 SiliconFlow。
      embedding:
        # cloud.siliconflow.cn 创建的 Key 对应 api.siliconflow.cn。
        base-url: ${SILICONFLOW_BASE_URL:https://api.siliconflow.cn}
        api-key: ${SILICONFLOW_API_KEY:}
        options:
          model: ${SILICONFLOW_EMBEDDING_MODEL:Qwen/Qwen3-Embedding-0.6B}
          dimensions: ${SILICONFLOW_EMBEDDING_DIMENSIONS:1024}

cache:
  shop-bloom:
    # 默认每天凌晨 03:00 重建；可通过 SHOP_BLOOM_REBUILD_CRON 覆盖。
    rebuild-cron: ${SHOP_BLOOM_REBUILD_CRON:0 0 3 * * ?}

agent:
  ai:
    enabled: ${AGENT_AI_ENABLED:false}
  memory:
    short-ttl-hours: ${AGENT_SHORT_MEMORY_TTL_HOURS:24}
    max-messages: ${AGENT_SHORT_MEMORY_MAX_MESSAGES:12}
  evaluation:
    # 自动评测会真实调用模型和业务只读工具，默认关闭；仅在受控环境显式启用。
    enabled: ${AGENT_EVALUATION_ENABLED:false}
    dataset: ${AGENT_EVALUATION_DATASET:classpath:agent-evaluation/golden-dataset.json}
    user-id: ${AGENT_EVALUATION_USER_ID:-9000001}
    max-trials-per-run: ${AGENT_EVALUATION_MAX_TRIALS:20}
  rag:
    enabled: ${AGENT_RAG_ENABLED:true}
    # 必须与 SiliconFlow Embedding 输出维度保持一致。
    dimensions: ${AGENT_RAG_DIMENSIONS:1024}
    # RAG 使用独立 PostgreSQL + pgvector，不会写入业务 MySQL。
    datasource:
      url: ${AGENT_RAG_PG_URL:jdbc:postgresql://localhost:5433/smart_campus_ai}
      username: ${AGENT_RAG_PG_USERNAME:smart_campus_ai}
      password: ${AGENT_RAG_PG_PASSWORD:smart_campus_ai}
    schema-name: ${AGENT_RAG_PG_SCHEMA:public}
    # 新表名用于隔离历史不同维度的向量表。
    table-name: ${AGENT_RAG_PG_TABLE:agent_knowledge_vector_1024}
    initialize-schema: ${AGENT_RAG_INITIALIZE_SCHEMA:true}
    rebuild-on-startup: ${AGENT_RAG_REBUILD_ON_STARTUP:true}
    rebuild-cron: ${AGENT_RAG_REBUILD_CRON:0 30 3 * * ?}

mybatis-plus:
  type-aliases-package: com.smartcampus.entity

logging:
  level:
    com.smartcampus: debug
