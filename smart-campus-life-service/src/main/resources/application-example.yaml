server:
  port: 8082

spring:
  application:
    name: smart-campus-life
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_campus_life?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379
      database: 6
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME:hmdp}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:hmdp}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2
          max-interval: 10000ms
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:openai}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:openai}
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      # DeepSeek 使用 OpenAI 兼容协议，因此仍复用 Spring AI OpenAI Starter。
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
          temperature: 0.2
      # Embedding 与 DeepSeek Chat 分开配置，默认使用 SiliconFlow。
      embedding:
        # cloud.siliconflow.cn 创建的 Key 对应 api.siliconflow.cn。
        base-url: ${SILICONFLOW_BASE_URL:https://api.siliconflow.cn}
        api-key: ${SILICONFLOW_API_KEY:}
        options:
          model: ${SILICONFLOW_EMBEDDING_MODEL:Qwen/Qwen3-Embedding-0.6B}
          dimensions: ${SILICONFLOW_EMBEDDING_DIMENSIONS:1024}

cache:
  shop-bloom:
    # 默认每天凌晨 03:00 重建；可通过 SHOP_BLOOM_REBUILD_CRON 覆盖。
    rebuild-cron: ${SHOP_BLOOM_REBUILD_CRON:0 0 3 * * ?}

agent:
  stream:
    # SSE 连接最长保留时间；需大于模型与工具链的最坏执行时间。
    timeout-ms: ${AGENT_STREAM_TIMEOUT_MS:120000}
    # 每个 delta 事件包含的最大 Unicode 字符数；前端会继续执行平滑打字动画。
    chunk-code-points: ${AGENT_STREAM_CHUNK_CODE_POINTS:12}
  ai:
    enabled: ${AGENT_AI_ENABLED:false}
  workflow:
    # 每个关键阶段写入 Redis；终态记录和用户最近执行索引保留 7 天。
    ttl-days: ${AGENT_WORKFLOW_TTL_DAYS:7}
    recent-limit: ${AGENT_WORKFLOW_RECENT_LIMIT:50}
    # 同步请求无法从模型调用中点安全续跑，超时后标记失败并保留故障阶段。
    stale-minutes: ${AGENT_WORKFLOW_STALE_MINUTES:30}
    recovery-interval-ms: ${AGENT_WORKFLOW_RECOVERY_INTERVAL_MS:60000}
  memory:
    # 复用 Agent RAG 的 PostgreSQL 数据源保存完整会话、摘要版本和结构化长期偏好。
    persistence-enabled: ${AGENT_MEMORY_PERSISTENCE_ENABLED:true}
    initialize-schema: ${AGENT_MEMORY_INITIALIZE_SCHEMA:true}
    schema-name: ${AGENT_MEMORY_SCHEMA:public}
    short-ttl-hours: ${AGENT_SHORT_MEMORY_TTL_HOURS:24}
    max-messages: ${AGENT_SHORT_MEMORY_MAX_MESSAGES:16}
    max-context-chars: ${AGENT_MEMORY_MAX_CONTEXT_CHARS:6000}
    summary:
      recent-messages: ${AGENT_MEMORY_SUMMARY_RECENT_MESSAGES:16}
      min-new-messages: ${AGENT_MEMORY_SUMMARY_MIN_NEW_MESSAGES:4}
      overlap-messages: ${AGENT_MEMORY_SUMMARY_OVERLAP_MESSAGES:2}
      max-source-messages: ${AGENT_MEMORY_SUMMARY_MAX_SOURCE_MESSAGES:120}
  evaluation:
    # 自动评测会真实调用模型和业务只读工具，默认关闭；仅在受控环境显式启用。
    enabled: ${AGENT_EVALUATION_ENABLED:false}
    dataset: ${AGENT_EVALUATION_DATASET:classpath:agent-evaluation/golden-dataset.json}
    user-id: ${AGENT_EVALUATION_USER_ID:-9000001}
    max-trials-per-run: ${AGENT_EVALUATION_MAX_TRIALS:20}
  rag:
    enabled: ${AGENT_RAG_ENABLED:true}
    # 必须与 SiliconFlow Embedding 输出维度保持一致。
    dimensions: ${AGENT_RAG_DIMENSIONS:1024}
    # RAG 使用独立 PostgreSQL + pgvector，不会写入业务 MySQL。
    datasource:
      url: ${AGENT_RAG_PG_URL:jdbc:postgresql://localhost:5433/smart_campus_ai}
      username: ${AGENT_RAG_PG_USERNAME:smart_campus_ai}
      password: ${AGENT_RAG_PG_PASSWORD:smart_campus_ai}
    schema-name: ${AGENT_RAG_PG_SCHEMA:public}
    # 新表名用于隔离历史不同维度的向量表。
    table-name: ${AGENT_RAG_PG_TABLE:agent_knowledge_vector_1024}
    initialize-schema: ${AGENT_RAG_INITIALIZE_SCHEMA:true}
    rebuild-on-startup: ${AGENT_RAG_REBUILD_ON_STARTUP:true}
    rebuild-cron: ${AGENT_RAG_REBUILD_CRON:0 30 3 * * ?}
    cleanup-cron: ${AGENT_RAG_CLEANUP_CRON:0 10 4 * * ?}
    # Hybrid RAG：扩大两路召回，再融合、精排并压缩为最终上下文。
    vector-top-k: ${AGENT_RAG_VECTOR_TOP_K:12}
    keyword-top-k: ${AGENT_RAG_KEYWORD_TOP_K:12}
    final-top-k: ${AGENT_RAG_FINAL_TOP_K:4}
    similarity-threshold: ${AGENT_RAG_SIMILARITY_THRESHOLD:0.45}
    max-context-chars: ${AGENT_RAG_MAX_CONTEXT_CHARS:1400}
    keyword:
      # 使用 PostgreSQL 自带 pg_trgm 为 ILIKE 子串匹配建立 GIN 索引；无安装权限时自动降级。
      trigram-enabled: ${AGENT_RAG_TRIGRAM_ENABLED:true}
    query-rewrite:
      # 会额外调用一次聊天模型；关闭时直接使用原问题。
      enabled: ${AGENT_RAG_QUERY_REWRITE_ENABLED:true}
    reranker:
      # 未配置 Key 或调用失败时自动保留 RRF 融合排序。
      enabled: ${AGENT_RAG_RERANKER_ENABLED:true}
      base-url: ${SILICONFLOW_BASE_URL:https://api.siliconflow.cn}
      api-key: ${SILICONFLOW_API_KEY:${spring.ai.openai.embedding.api-key:}}
      model: ${SILICONFLOW_RERANKER_MODEL:BAAI/bge-reranker-v2-m3}

mybatis-plus:
  type-aliases-package: com.smartcampus.entity

logging:
  level:
    com.smartcampus: debug
